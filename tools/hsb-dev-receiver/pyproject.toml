[project]
name = "hsb-dev-receiver"
version = "0.2.0"
description = "Host-side bring-up and verification tools for the Hailo-15 HSB sender"
license = "MIT"
requires-python = ">=3.10"
dependencies = ["numpy>=1.24"]

[project.optional-dependencies]
display = ["opencv-python>=4.8"]
test = ["pytest>=7"]

[tool.ruff]
line-length = 88
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["E501"]

[tool.pytest.ini_options]
testpaths = ["tests"]
